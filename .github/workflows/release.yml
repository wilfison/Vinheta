name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (e.g. v1.0.0)"
        required: true
        default: ""

permissions:
  contents: read

env:
  TAG: ${{ inputs.ref || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # To cancel the CI of the tagged commit.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The release runs the CI gate itself, so the CI of the same commit (main
      # pushed together with the tag) would only repeat it.
      - name: Cancel the CI of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --commit "$(git rev-parse HEAD)" \
              --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' |
            while read -r run; do gh run cancel "$run" || true; done

      - name: The tag matches the version
        run: scripts/version.sh "$TAG"

  # The full CI gate again, so a tag never ships what main would reject. It
  # also builds the package that the release publishes.
  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.ref }}

  release:
    needs: ci
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The earlier tags, for the "Full diff" link of the notes.
          fetch-depth: 0

      - name: Get the package
        uses: actions/download-artifact@v4
        with:
          name: vinheta-deb
          path: tmp/deb

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$TAG"
