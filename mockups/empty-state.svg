<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 700" width="1000" height="700" font-family="'Adwaita Sans', Inter, Cantarell, 'Noto Sans', sans-serif" fill="#ffffff">
  <title>Vinheta: empty state mockup</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="win"><rect x="24" y="24" width="952" height="652" rx="14"/></clipPath>

    <g id="i-loop" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8a5 5 0 0 1 9-3"/><path d="M12.5 1.8v3.5H9"/>
      <path d="M13 8a5 5 0 0 1-9 3"/><path d="M3.5 14.2v-3.5H7"/>
    </g>
    <polygon id="i-star" points="8,1.5 10,6 14.8,6.4 11.2,9.6 12.3,14.3 8,11.8 3.7,14.3 4.8,9.6 1.2,6.4 6,6"/>
    <g id="i-search" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
      <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>
    </g>
    <g id="i-plus" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
      <path d="M8 2.5v11M2.5 8h11"/>
    </g>
    <g id="i-menu" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
      <path d="M2.5 4h11M2.5 8h11M2.5 12h11"/>
    </g>
    <g id="i-phones" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
      <path d="M3 10V8a5 5 0 0 1 10 0v2"/>
      <rect x="2" y="9.5" width="3" height="4.5" rx="1" fill="#fff"/>
      <rect x="11" y="9.5" width="3" height="4.5" rx="1" fill="#fff"/>
    </g>
    <g id="i-mic" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
      <rect x="6" y="1.5" width="4" height="8" rx="2" fill="#fff"/>
      <path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5V14.5"/>
    </g>
    <g id="i-output" fill="#fff">
      <path d="M2 6h2.500l3.500-3v10l-3.500-3H2z"/>
      <path d="M10 5.500a3.500 3.500 0 0 1 0 5M11.800 3.500a6 6 0 0 1 0 9" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <rect x="24" y="24" width="952" height="652" rx="14" fill="#242424"/>
  </g>

  <g clip-path="url(#win)">
    <!-- Header bar -->
    <rect x="24" y="24" width="952" height="47" fill="#303030"/>
    <rect x="34" y="31" width="34" height="34" rx="8" fill="#fff" fill-opacity=".1"/>
    <use xlink:href="#i-plus" href="#i-plus" x="43" y="40"/>
    <use xlink:href="#i-search" href="#i-search" x="83" y="40"/>
    <text x="500" y="53" text-anchor="middle" font-size="14" font-weight="700">Vinheta</text>
    <use xlink:href="#i-menu" href="#i-menu" x="900" y="40"/>
    <circle cx="950" cy="48" r="12" fill="#fff" fill-opacity=".12"/>
    <path d="M946 44l8 8M954 44l-8 8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Empty state (AdwStatusPage) -->
    <g opacity=".5" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M452 214h20l28-24v84l-28-24h-20z" fill="#fff"/>
      <path d="M520 212a28 28 0 0 1 0 40"/>
      <path d="M536 194a52 52 0 0 1 0 76"/>
    </g>
    <text x="500" y="336" text-anchor="middle" font-size="26" font-weight="800">No Sounds Yet</text>
    <text x="500" y="366" text-anchor="middle" font-size="14" fill-opacity=".7">Add audio files or drop them here to build your soundboard</text>
    <rect x="430" y="392" width="140" height="44" rx="22" fill="#3584e4"/>
    <text x="500" y="419" text-anchor="middle" font-size="14" font-weight="700">Add Sounds…</text>
    <text x="500" y="520" text-anchor="middle" font-size="12" fill-opacity=".55">Tip: join a call with your usual microphone, and the sounds you play are heard there</text>

    <!-- Bottom bar -->
    <rect x="24" y="572" width="952" height="104" fill="#303030"/>
    <rect x="24" y="572" width="952" height="1" fill="#000" fill-opacity=".35"/>

    <rect x="48" y="606" width="132" height="36" rx="9" fill="#fff" fill-opacity=".08"/>
    <rect x="66" y="619" width="10" height="10" rx="2" fill="#fff" fill-opacity=".4"/>
    <text x="86" y="629" font-size="13" font-weight="700" fill-opacity=".4">Stop all</text>

    <!-- Local volume -->
    <use xlink:href="#i-phones" href="#i-phones" x="216" y="597"/>
    <text x="242" y="609.500" font-size="13">Headphones</text>
    <rect x="340" y="603" width="260" height="4" rx="2" fill="#fff" fill-opacity=".18"/>
    <rect x="340" y="603" width="140" height="4" rx="2" fill="#78aeed"/>
    <circle cx="480" cy="605" r="9" fill="#fff"/>
    <text x="650" y="609.500" text-anchor="end" font-size="12" fill-opacity=".6">54%</text>

    <!-- Remote volume -->
    <use xlink:href="#i-mic" href="#i-mic" x="216" y="635"/>
    <text x="242" y="647.500" font-size="13">Call</text>
    <rect x="340" y="641" width="260" height="4" rx="2" fill="#fff" fill-opacity=".18"/>
    <rect x="340" y="641" width="221" height="4" rx="2" fill="#78aeed"/>
    <circle cx="561" cy="643" r="9" fill="#fff"/>
    <text x="650" y="647.500" text-anchor="end" font-size="12" fill-opacity=".6">85%</text>

    <!-- Selector of the app the sounds are sent to -->
    <rect x="690" y="590" width="262" height="36" rx="9" fill="#fff" fill-opacity=".1"/>
    <use xlink:href="#i-output" href="#i-output" x="702" y="600"/>
    <text x="726" y="612.500" font-size="13">All Apps</text>
    <path d="M928 605.500l5 5 5-5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="692" y="653.500" font-size="13">Send sounds to call</text>
    <rect x="906" y="636" width="46" height="26" rx="13" fill="#3584e4"/>
    <circle cx="939" cy="649" r="11" fill="#fff"/>
  </g>
</svg>
