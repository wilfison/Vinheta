<rect x="588" y="604.0" width="24" height="26" rx="6" fill="#fff" fill-opacity=".12"/><text x="600.0" y="621.5" font-size="12" font-weight="700" text-anchor="middle">S</text>
<rect x="526" y="604.0" width="56" height="26" rx="6" fill="#fff" fill-opacity=".12"/><text x="554.0" y="621.5" font-size="12" font-weight="700" text-anchor="middle">Shift</text>
