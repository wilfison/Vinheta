<rect x="60" y="527" width="568" height="120" rx="12" fill="#fff" fill-opacity=".08"/>
<text x="76" y="553" font-size="14">Global Shortcuts</text><text x="76" y="572" font-size="12" fill-opacity=".6">Trigger pads while Vinheta is in the background</text>
<rect x="566" y="544.0" width="46" height="26" rx="13" fill="#fff" fill-opacity=".2"/><circle cx="579" cy="557.0" r="11" fill="#fff"/>
<rect x="60" y="587" width="568" height="1" fill="#fff" fill-opacity=".1"/>
