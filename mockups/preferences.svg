<rect x="60" y="119" width="568" height="180" rx="12" fill="#fff" fill-opacity=".08"/>
<text x="76" y="145" font-size="14">Monitor Output</text><text x="76" y="164" font-size="12" fill-opacity=".6">Where you hear the sounds</text>
<text x="590" y="154.0" font-size="14" text-anchor="end" fill-opacity=".8">Headphones</text><path d="M600 147.0l5 5 5-5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="179" width="568" height="1" fill="#fff" fill-opacity=".1"/>
<text x="76" y="205" font-size="14">Send Sounds to Call</text><text x="76" y="224" font-size="12" fill-opacity=".6">Play sounds into the apps that are using the microphone</text>
<rect x="566" y="196.0" width="46" height="26" rx="13" fill="#3584e4"/><circle cx="599" cy="209.0" r="11" fill="#fff"/>
<rect x="60" y="239" width="568" height="1" fill="#fff" fill-opacity=".1"/>
