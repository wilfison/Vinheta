<rect x="60" y="353" width="568" height="120" rx="12" fill="#fff" fill-opacity=".08"/>
<text x="76" y="388.0" font-size="14">When a Pad Is Triggered</text>
<text x="590" y="388.0" font-size="14" text-anchor="end" fill-opacity=".8">Overlap</text><path d="M600 381.0l5 5 5-5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="413" width="568" height="1" fill="#fff" fill-opacity=".1"/>
<text x="76" y="439" font-size="14">Fade Out on Stop</text><text x="76" y="458" font-size="12" fill-opacity=".6">Avoids abrupt cuts when stopping a sound</text>
<rect x="566" y="430.0" width="46" height="26" rx="13" fill="#3584e4"/><circle cx="599" cy="443.0" r="11" fill="#fff"/>
