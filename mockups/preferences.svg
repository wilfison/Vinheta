<text x="590" y="274.0" font-size="14" text-anchor="end" fill-opacity=".8">All Apps</text><path d="M600 267.0l5 5 5-5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
