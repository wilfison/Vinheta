<rect x="566" y="718.0" width="46" height="26" rx="13" fill="#3584e4"/><circle cx="599" cy="731.0" r="11" fill="#fff"/>
<rect x="60" y="761" width="568" height="1" fill="#fff" fill-opacity=".1"/>
