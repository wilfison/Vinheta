<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 941" width="688" height="941" font-family="'Adwaita Sans', Inter, Cantarell, 'Noto Sans', sans-serif" fill="#ffffff">
<title>Vinheta — preferences mockup</title>
