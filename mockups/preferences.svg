<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 881" width="688" height="881" font-family="'Adwaita Sans', Inter, Cantarell, 'Noto Sans', sans-serif" fill="#ffffff">
<title>Vinheta: preferences mockup</title>
<defs><filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
<clipPath id="w"><rect x="24" y="24" width="640" height="833" rx="14"/></clipPath></defs>
<rect x="24" y="24" width="640" height="833" rx="14" fill="#242424" filter="url(#s)"/>
<g clip-path="url(#w)">
<rect x="24" y="24" width="640" height="47" fill="#303030"/>
<text x="344.0" y="53" text-anchor="middle" font-size="14" font-weight="700">Preferences</text>
