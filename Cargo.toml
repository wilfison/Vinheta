[package]
name = "vinheta"
version = "1.2.0"
rust-version = "1.93"
edition = "2021"
default-run = "vinheta"

[features]
audio-test = []

[[bin]]
name = "vinheta-audio-test"
path = "src/bin/vinheta-audio-test.rs"
required-features = ["audio-test"]

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
async-channel = "2"
gst = { version = "0.23", package = "gstreamer" }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
pipewire = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_7"]
